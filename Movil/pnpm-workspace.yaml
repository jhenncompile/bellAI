# Nombres cortos en node_modules/.pnpm: en Windows, con el proyecto en una ruta larga, las carpetas
# nativas de CMake superaban los 260 caracteres y la compilación de Android fallaba al lanzar prefab.
virtualStoreDirMaxLength: 30
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.29'
  - '@expo/fingerprint@0.20.14'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - '@expo/prebuild-config@57.0.18'
  - '@expo/ui@57.0.23'
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - expo-router@57.0.26
  - expo-splash-screen@57.0.10
  - expo@57.0.28
patchedDependencies:
  '@react-native-async-storage/async-storage@2.2.0': patches/@react-native-async-storage__async-storage@2.2.0.patch
  onnxruntime-react-native@1.24.3: patches/onnxruntime-react-native@1.24.3.patch
