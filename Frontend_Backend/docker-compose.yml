# Sistema BellAI completo. Variables opcionales en un archivo .env junto a este compose
# (ver backend/.env.example). Los valores por defecto son solo para desarrollo local.
#
#   docker compose up -d                          # todo el sistema
#   docker compose up -d postgres redis           # solo infraestructura (backend con npm run dev)
#   docker compose exec ollama ollama pull llama3:8b-instruct-q4_K_M   # modelo del asistente (Llama 3 8B Q4_K_M, ~4,9 GB; requiere ~6 GB de RAM)
services:
  # 1. Base de Datos PostgreSQL 17
  postgres:
    image: postgres:17-alpine
    container_name: bellia_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-valeria}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-bellia}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis: caché y cola de tareas de IA (BullMQ, HU-041)
  redis:
    image: redis:7-alpine
    container_name: bellia_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # 3. Servicio de IA (FastAPI + MediaPipe + CLIP): diagnóstico, prendas y simulaciones
  ai:
    build:
      context: ./backend/ai
      dockerfile: Dockerfile
    container_name: bellia_ai
    restart: always
    environment:
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:-}
    ports:
      - '8001:8000'

  # 4. Modelo de lenguaje local para el asistente (HU-026, HU-042)
  ollama:
    image: ollama/ollama:latest
    container_name: bellia_ollama
    restart: always
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama

  # 5. Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bellia_backend
    restart: always
    ports:
      - '8000:8000'
    environment:
      PORT: ${PORT:-8000}
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-desarrollo}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-valeria}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-bellia}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      CACHE_TTL: ${CACHE_TTL:-300000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      AI_SERVICE_URL: http://ai:8000
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_URL: http://ollama:11434
      CDN_BASE_URL: ${CDN_BASE_URL:-http://localhost:8000/uploads}
      # Suscripciones: Stripe en modo de prueba (sk_test_...)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PREMIUM_PRICE_CENTS: ${PREMIUM_PRICE_CENTS:-4900}
      PREMIUM_CURRENCY: ${PREMIUM_CURRENCY:-bob}
      PREMIUM_DAYS: ${PREMIUM_DAYS:-30}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads

  # 6. Panel administrativo React 19 + Vite
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: bellia_frontend
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  ollama_data:
